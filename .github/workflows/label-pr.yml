name: PR Labeler

permissions:
    contents: read
    pull-requests: write

on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    label:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/labeler@v4
              with:
                  repo-token: '${{ secrets.GITHUB_TOKEN }}'
                  sync-labels: true
                  dot: true
                  configuration-path: .github/labeler.yml
