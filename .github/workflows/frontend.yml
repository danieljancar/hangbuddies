name: Frontend CI

on:
    push:
        paths:
            - 'apps/frontend/**'
    pull_request:
        paths:
            - 'apps/frontend/**'

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: apps/frontend/package-lock.json

            - name: Install dependencies
              run: npm ci --prefix apps/backend

            - name: Lint
              run: npx eslint .

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: apps/frontend/package-lock.json

            - name: Install dependencies
              run: npm ci --prefix apps/backend

            - name: Build App
              run: npm run build --prefix apps/frontend
