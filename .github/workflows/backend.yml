name: Backend CI

on:
    push:
        paths:
            - 'apps/backend/**'
    pull_request:
        paths:
            - 'apps/backend/**'

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: apps/backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint --prefix apps/backend

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: apps/backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build App
              run: npm run build --prefix apps/backend
