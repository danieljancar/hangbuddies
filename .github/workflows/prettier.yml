name: Prettier

on:
    pull_request:
    push:
        branches: [develop, master]

jobs:
    prettier:
        name: Prettier
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npx prettier --check .
