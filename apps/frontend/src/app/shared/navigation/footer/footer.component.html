<footer class="footer">
    <mat-toolbar class="footer__toolbar">
        <div class="footer__toolbar-brand">
            <a [routerLink]="APP_ROUTES.HOME.LANDING" class="util-link-image">
                <img
                    alt="Logo"
                    class="footer__toolbar-logo"
                    height="120"
                    ngSrc="/icon.png"
                    priority
                    width="120"
                />
            </a>
            <a [routerLink]="APP_ROUTES.HOME.LANDING" mat-flat-button>
                Preferences
            </a>
        </div>
    </mat-toolbar>
    <div class="footer__content">
        <div class="footer__content-text">
            <p>
                A fast, shareable, and registration-free survey tool for
                effortless event scheduling with friends, teams, and more.
            </p>
        </div>
        <div class="footer__content-links">
            <div class="footer__content-link-section">
                <a [routerLink]="APP_ROUTES.HOME.LANDING"> Privacy Policy </a>
            </div>
        </div>
    </div>
</footer>
