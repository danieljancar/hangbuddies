<ul class="articles">
    @for (article of articles; track article.id) {
        <app-blog-post [post]="article" />
        <mat-divider />
    }
    <a
        [routerLink]="APP_ROUTES.BLOG.OVERVIEW"
        class="articles__view-all"
        mat-button
    >
        View all posts
        <mat-icon>arrow_forward</mat-icon>
    </a>
</ul>
