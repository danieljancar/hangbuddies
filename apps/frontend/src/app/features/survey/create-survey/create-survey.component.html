<div class="create-survey__wrapper">
    <h1>Create Survey</h1>
    <form [formGroup]="form" class="create-survey">
        <section class="create-survey__details">
            <h2>Details</h2>
            <div class="create-survey__details-list">
                <mat-form-field appearance="outline">
                    <mat-label>Title</mat-label>
                    <input
                        formControlName="title"
                        matInput
                        placeholder="Your title..."
                        required
                    />
                    @if (
                        form.get('title')?.hasError('required') &&
                        form.get('title')?.touched
                    ) {
                        <mat-error>Title is required</mat-error>
                    }
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Description</mat-label>
                    <textarea
                        formControlName="description"
                        matInput
                        placeholder="Your description..."
                    ></textarea>
                </mat-form-field>
            </div>
        </section>
        <section class="create-survey__questions" formArrayName="questions">
            <h2>Questions</h2>
            <div
                (cdkDropListDropped)="drop($event)"
                cdkDropList
                class="create-survey__list"
            >
                @for (q of questions.controls; track q.controls.order.value) {
                    <div
                        cdkDrag
                        [formGroupName]="$index"
                        class="create-survey__item"
                    >
                        <button
                            mat-icon-button
                            cdkDragHandle
                            class="create-survey__drag-handle"
                        >
                            <mat-icon>drag_indicator</mat-icon>
                        </button>

                        <div class="create-survey__field">
                            @switch (q.controls.type.value) {
                                @case ('text') {
                                    <app-text-question [group]="q" />
                                }
                            }
                        </div>

                        <button
                            mat-icon-button
                            color="warn"
                            class="create-survey__remove"
                            (click)="removeQuestion($index)"
                        >
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                    <mat-divider />
                }
            </div>
            <div class="create-survey__add">
                <button
                    (click)="addQuestion()"
                    mat-stroked-button
                    type="button"
                >
                    <mat-icon>add</mat-icon>
                    Add Question
                </button>
            </div>
        </section>
    </form>
    <div class="create-survey__wrapper-actions">
        <button class="btn_secondary" mat-stroked-button>
            <mat-icon>cancel</mat-icon>
            Cancel
        </button>
        <button [disabled]="form.invalid" mat-flat-button>
            <mat-icon>check</mat-icon>
            Review
        </button>
    </div>
</div>
