services:
  backend:
    image: hangbuddies/backend:${DEPLOYMENT}
    container_name: hangbuddies-backend-${DEPLOYMENT}
    restart: always
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_APP_NAME=${MONGO_APP_NAME}
    networks:
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.${BACKEND_IDENTIFIER}.tls=true
      - traefik.http.routers.${BACKEND_IDENTIFIER}.entrypoints=websecure
      - traefik.http.routers.${BACKEND_IDENTIFIER}.rule=Host(`${BACKEND_HOST}`)
      - traefik.http.routers.${BACKEND_IDENTIFIER}.service=${BACKEND_IDENTIFIER}
      - traefik.http.services.${BACKEND_IDENTIFIER}.loadbalancer.server.port=3000
      - traefik.docker.network=traefik-net
  
  frontend:
    image: hangbuddies/frontend:${DEPLOYMENT}
    container_name: hangbuddies-frontend-${DEPLOYMENT}
    restart: always
    depends_on:
      - backend
    networks:
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.${FRONTEND_IDENTIFIER}.tls=true
      - traefik.http.routers.${FRONTEND_IDENTIFIER}.entrypoints=websecure
      - traefik.http.routers.${FRONTEND_IDENTIFIER}.rule=Host(`${FRONTEND_HOST}`)
      - traefik.http.routers.${FRONTEND_IDENTIFIER}.service=${FRONTEND_IDENTIFIER}
      - traefik.http.services.${FRONTEND_IDENTIFIER}.loadbalancer.server.port=80
      - traefik.docker.network=traefik-net
  
  mongodb:
        image: mongo
        container_name: mongo-${DEPLOYMENT}
        volumes:
            - ./mongodb_data:/data/db
        environment:
            MONGO_INITDB_DATABASE: hangbuddies
        networks:
          - traefik-net

networks:
  traefik-net:
    external: true
    